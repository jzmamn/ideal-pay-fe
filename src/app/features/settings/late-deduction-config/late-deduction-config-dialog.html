<div mat-dialog-title class="dialog-title">
  <div class="dialog-title-icon">
    <mat-icon>schedule</mat-icon>
  </div>
  <span class="dialog-title-main">Late Deduction Configuration</span>
  <button mat-icon-button mat-dialog-close class="dialog-close-btn" aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">

    <div class="form-row-2">
      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" placeholder="Auto-generated">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
        @if (form.get('name')?.hasError('required')) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"
                placeholder="e.g. Standard late deduction rule for all employees"></textarea>
    </mat-form-field>

    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>

    <mat-divider />

    <p class="section-label">Statutory Liabilities</p>
    <div class="toggles-grid">
      <mat-slide-toggle formControlName="liableForEpf">Liable for EPF</mat-slide-toggle>
      <mat-slide-toggle formControlName="liableForEtf">Liable for ETF</mat-slide-toggle>
      <mat-slide-toggle formControlName="liableForPaye">Liable for PAYE</mat-slide-toggle>
      <mat-slide-toggle formControlName="liableForNopay">Liable for No Pay</mat-slide-toggle>
    </div>

  </form>

  <mat-divider />

  <app-formula-definition-form
    #formulaForm
    [initialExpression]="formulaExpression()"
    [showActiveToggle]="false"
    [saving]="formulaSaving()"
    [saveError]="formulaSaveError()"
    (valueChanged)="onFormulaValueChanged($event)"
    (saveRequested)="onFormulaSaveRequested($event)"
  />

  <div class="formula-save-row">
    <button mat-stroked-button type="button" (click)="formulaForm.save()" aria-label="Apply formula">
      <mat-icon>calculate</mat-icon> Apply Formula
    </button>
  </div>

</mat-dialog-content>

<mat-dialog-actions>
  <span class="action-spacer"></span>
  <button mat-flat-button [disabled]="form.invalid" class="btn-warn" (click)="save()">
    <mat-icon>save</mat-icon> Update
  </button>
  <button mat-flat-button mat-dialog-close class="btn-secondary">
    <mat-icon>close</mat-icon> Cancel
  </button>
</mat-dialog-actions>
